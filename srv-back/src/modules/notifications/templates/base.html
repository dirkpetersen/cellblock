<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{subject}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      line-height: 1.6;
      color: #27272A;
      background-color: #F1F5F9;
    }
    .email-wrapper {
      width: 100%;
      background-color: #F1F5F9;
      padding: 40px 20px;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .email-header {
      background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%);
      color: #FFFFFF;
      padding: 40px 30px;
      text-align: center;
    }
    .email-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .email-header .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .email-body {
      padding: 40px 30px;
    }
    .email-body p {
      margin: 0 0 16px 0;
      color: #475569;
      font-size: 16px;
    }
    .email-body h2 {
      color: #1E293B;
      font-size: 22px;
      margin: 0 0 20px 0;
      font-weight: 600;
    }
    .button {
      display: inline-block;
      background: #0D9488;
      color: #FFFFFF !important;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      margin: 20px 0;
      transition: background 0.2s;
    }
    .button:hover {
      background: #0F766E;
    }
    .button-secondary {
      background: #64748B;
    }
    .button-secondary:hover {
      background: #475569;
    }
    .button-danger {
      background: #EF4444;
    }
    .button-danger:hover {
      background: #DC2626;
    }
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .alert-info {
      background-color: #E0F2FE;
      border-left: 4px solid #0EA5E9;
      color: #075985;
    }
    .alert-warning {
      background-color: #FEF3C7;
      border-left: 4px solid #F59E0B;
      color: #92400E;
    }
    .alert-danger {
      background-color: #FEE2E2;
      border-left: 4px solid #EF4444;
      color: #991B1B;
    }
    .alert-success {
      background-color: #D1FAE5;
      border-left: 4px solid #10B981;
      color: #065F46;
    }
    .email-footer {
      background-color: #F8FAFC;
      padding: 30px;
      text-align: center;
      border-top: 1px solid #E2E8F0;
    }
    .email-footer p {
      margin: 8px 0;
      color: #64748B;
      font-size: 14px;
    }
    .email-footer a {
      color: #0D9488;
      text-decoration: none;
    }
    .email-footer a:hover {
      text-decoration: underline;
    }
    .divider {
      border: none;
      border-top: 1px solid #E2E8F0;
      margin: 30px 0;
    }
    .text-muted {
      color: #94A3B8;
      font-size: 14px;
    }
    @media only screen and (max-width: 600px) {
      .email-header, .email-body, .email-footer {
        padding: 20px !important;
      }
      .button {
        display: block;
        margin: 15px 0;
      }
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <div class="email-header">
        <div class="logo">CellBlock</div>
        <p style="margin: 0; opacity: 0.9;">Digital Wellbeing with Accountability</p>
      </div>

      <div class="email-body">
        {{content}}
      </div>

      <div class="email-footer">
        <p><strong>CellBlock</strong></p>
        <p>Digital Wellbeing with Accountability</p>
        <p class="text-muted">
          Need help? Contact us at <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>
        </p>
        <p class="text-muted">
          &copy; {{currentYear}} CellBlock. All rights reserved.
        </p>
        {{#if unsubscribeUrl}}
        <p class="text-muted">
          <a href="{{unsubscribeUrl}}">Unsubscribe</a> from these emails
        </p>
        {{/if}}
      </div>
    </div>
  </div>
</body>
</html>
