  <!-- Top horizontal bars -->
  <rect x="180" y="160" width="100" height="20" rx="10" fill="#0D9488"/>
  <rect x="290" y="160" width="62" height="20" rx="10" fill="#0D9488"/>

  <!-- Middle horizontal bars (shorter to form C) -->
  <rect x="180" y="246" width="70" height="20" rx="10" fill="#0D9488"/>
  <rect x="260" y="246" width="50" height="20" rx="10" fill="#0D9488"/>

