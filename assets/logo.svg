  <rect x="290" y="332" width="62" height="20" rx="10" fill="#0D9488"/>

  <!-- Right side bars forming "B" -->
  <!-- Right vertical bar -->
  <rect x="332" y="160" width="20" height="192" rx="10" fill="#475569"/>

  <!-- Top curve of B -->
  <path d="M332 180 Q352 160 372 180 Q382 190 382 210 Q382 230 372 240 L332 246"
